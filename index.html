<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RITchie's Pop Star</title>
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#1b2b4a;
      --panel: rgba(255,255,255,0.08);
      --text: #eaf0ff;
      --muted: rgba(234,240,255,0.75);
      --accent: #7aa7ff;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 20% 20%, var(--bg2), var(--bg1));
      overflow:hidden;
    }

    .wrap{
      position:relative;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .game{
      width:min(980px, 100%);
      display:grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap:18px;
      align-items:stretch;
    }

    @media (max-width: 880px){
      .game{ grid-template-columns:1fr; }
    }

    .stage, .panel{
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius:18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .stage{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 560px;
      overflow:hidden;
    }

    /* ============
       Motion layers:
       balloon-rumble (shake pre-pop)
         balloon-wind (gust bias)
           balloon-sway (regular sway)
             img (scale + pop)
       ============ */

    .balloon-rumble{
      transform-origin: 50% 80%;
      will-change: transform;
    }

    .balloon-rumble.rumbling{
      animation: rumble 120ms ease-in-out infinite;
    }
    @keyframes rumble{
      0%   { transform: translateX(0px) rotate(0deg); }
      25%  { transform: translateX(1px) rotate(-0.2deg); }
      50%  { transform: translateX(0px) rotate(0.2deg); }
      75%  { transform: translateX(-1px) rotate(-0.2deg); }
      100% { transform: translateX(0px) rotate(0deg); }
    }

    .balloon-wind{
      --wind-deg: 0deg;
      --wind-x: 0px;

      transform-origin: 50% 80%;
      will-change: transform;
      transform: rotate(var(--wind-deg)) translateX(var(--wind-x));
      transition: transform 700ms ease-in-out;
    }

    .balloon-sway{
      --sway-deg: 1.0deg;
      --sway-x: 5px;
      --sway-y: 2px;

      transform-origin: 50% 80%;
      will-change: transform;
      animation: sway 6.2s ease-in-out infinite;
    }

    @keyframes sway{
      0%{
        transform:
          rotate(calc(-1 * var(--sway-deg)))
          translateX(calc(-1 * var(--sway-x)))
          translateY(var(--sway-y));
      }
      50%{
        transform:
          rotate(var(--sway-deg))
          translateX(var(--sway-x))
          translateY(calc(-1 * var(--sway-y)));
      }
      100%{
        transform:
          rotate(calc(-1 * var(--sway-deg)))
          translateX(calc(-1 * var(--sway-x)))
          translateY(var(--sway-y));
      }
    }

    .balloon{
      width: 240px;
      height: auto;
      transform-origin: 50% 80%;
      transform: scale(0); /* starts at 0 until Start is pressed */
      filter: drop-shadow(0 18px 22px rgba(0,0,0,0.45));
      user-select:none;
      -webkit-user-drag:none;
    }

    /* Pop animation (applied to the IMG only) */
    .pop{
      animation: pop 420ms ease-out forwards;
    }
    @keyframes pop{
      0%   { transform: scale(var(--s, 1)); opacity:1; }
      55%  { transform: scale(calc(var(--s, 1) * 1.12)); opacity:1; }
      100% { transform: scale(calc(var(--s, 1) * 0.25)); opacity:0; }
    }

    /* “Burst” ring effect behind balloon */
    .burst{
      position:absolute;
      width: 10px;
      height: 10px;
      border-radius:50%;
      border: 3px solid rgba(255,255,255,0.75);
      opacity:0;
      transform: scale(0.2);
      pointer-events:none;
    }
    .burst.show{
      animation: burst 520ms ease-out forwards;
    }
    @keyframes burst{
      0%{ opacity:0; transform: scale(0.2); }
      20%{ opacity:0.95; }
      100%{ opacity:0; transform: scale(18); }
    }

    .panel{
      padding:18px 18px 16px;
      display:flex;
      flex-direction:column;
      gap:14px;
      min-height: 560px;
    }

    .title{
      font-size: 20px;
      letter-spacing:0.2px;
      margin:0;
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    button{
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.16);
      background: rgba(122,167,255,0.18);
      color: var(--text);
      font-weight:700;
      cursor:pointer;
    }
    button:hover{ background: rgba(122,167,255,0.24); }
    button:disabled{
      opacity:0.5;
      cursor:not-allowed;
    }

    .start-btn{
      width: 100%;
      padding: 14px 14px;
      font-size: 16px;
      background: rgba(122,167,255,0.26);
    }
    .start-btn:hover{ background: rgba(122,167,255,0.32); }

    .points-grid{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:10px;
    }

    .points-grid button{
      padding: 14px 0;
      font-size: 16px;
    }

    .stats{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }

    .card{
      padding:12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
    }

    .label{
      font-size:12px;
      color: var(--muted);
      margin:0 0 6px 0;
    }
    .value{
      font-size:24px;
      margin:0;
      font-weight:800;
    }

    .log{
      padding:14px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
      font-size:14px;
      color: rgba(234,240,255,0.90);
      line-height:1.35;
      min-height: 52px;
      display:flex;
      align-items:center;
    }

    .spacer{
      flex:1;
    }

    .reset-btn{
      width: 100%;
      margin-top: 8px;
      background: rgba(255,255,255,0.10);
    }
    .reset-btn:hover{ background: rgba(255,255,255,0.14); }

    .fade{
      position:fixed;
      inset:0;
      background:#000;
      opacity:0;
      pointer-events:none;
      transition: opacity 900ms ease;
      z-index: 50;
    }
    .fade.on{
      opacity:1;
      pointer-events:auto;
    }

    /* Welcome screen: lighter background, black text */
    .welcome{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:18px;
      opacity:0;
      pointer-events:none;
      z-index: 60;
      transition: opacity 600ms ease;
      background: radial-gradient(900px 600px at 50% 30%, rgba(255,255,255,1), rgba(230,236,246,1));
      text-align:center;
      padding:24px;
      color:#0b0f18;
    }
    .welcome.on{
      opacity:1;
      pointer-events:auto;
    }
    .welcome h1{
      margin:0;
      font-size: clamp(72px, 7vw, 96px);
      letter-spacing: 0.6px;
    }
    .welcome p{
      margin:0;
      color: rgba(11,15,24,0.85);
      font-size: clamp(20px, 2.2vw, 28px);
      max-width: 52ch;
      font-weight: 600;
    }

    /* Pawprint “confetti” */
    .confetti{
      position:absolute;
      inset:0;
      overflow:hidden;
      pointer-events:none;
    }
    .paw{
      position:absolute;
      width: 26px;
      height: 26px;
      opacity: 0.0;
      background-repeat:no-repeat;
      background-size: contain;
      animation: fall 2.6s linear infinite;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.18));
    }
    @keyframes fall{
      0% { transform: translateY(-40px) rotate(0deg); opacity:0; }
      12%{ opacity:0.95; }
      90%{ opacity:0.95; }
      100%{ transform: translateY(110vh) rotate(65deg); opacity:0; }
    }

    .sr{
      position:absolute;
      left:-9999px;
      top:auto;
      width:1px;
      height:1px;
      overflow:hidden;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="game" id="gameRoot">
      <div class="stage">
        <div class="burst" id="burst"></div>

        <div id="balloonRumble" class="balloon-rumble">
          <div id="balloonWind" class="balloon-wind">
            <div id="balloonSway" class="balloon-sway">
              <img
                id="balloon"
                class="balloon"
                src="assets/balloon.png"
                alt="RITchie Balloon"
                draggable="false"
              />
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2 class="title">RITchie's Pop Star</h2>

        <button id="startBtn" class="start-btn" type="button">Start</button>

        <div class="points-grid" id="pointsGrid" aria-label="Point buttons 1 to 10">
          <button class="ptBtn" data-points="1" type="button">1</button>
          <button class="ptBtn" data-points="2" type="button">2</button>
          <button class="ptBtn" data-points="3" type="button">3</button>
          <button class="ptBtn" data-points="4" type="button">4</button>
          <button class="ptBtn" data-points="5" type="button">5</button>

          <button class="ptBtn" data-points="6" type="button">6</button>
          <button class="ptBtn" data-points="7" type="button">7</button>
          <button class="ptBtn" data-points="8" type="button">8</button>
          <button class="ptBtn" data-points="9" type="button">9</button>
          <button class="ptBtn" data-points="10" type="button">10</button>
        </div>

        <div class="stats">
          <div class="card">
            <p class="label">Total points</p>
            <p class="value" id="totalPoints">0</p>
          </div>
        </div>

        <div class="log" id="log" aria-live="polite"></div>

        <div class="spacer"></div>

        <button id="resetBtn" class="reset-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <div class="fade" id="fade"></div>

  <div class="welcome" id="welcome">
    <div class="confetti" id="confetti"></div>
    <h1 id="welcomeText">Welcome, Courtney!</h1>
    <p id="welcomeSubtext">We are excited to work under your leadership! Thanks for playing!</p>
    <button id="welcomeResetBtn" type="button">Play Again</button>
  </div>

  <script>
    // =========================
    // Config
    // =========================
    const CONFIG = {
      minTarget: 40,
      maxTarget: 60,

      // inflation timing
      inflateDurationMs: 2000,

      // pause after selecting points before inflation starts (requested: 1s)
      beforeInflateDelayMs: 1000,

      // pre-pop rumble duration (requested: 2s)
      rumbleDurationMs: 2000,

      // sizes (starting size same; max growth bigger)
      baseScale: 0.35,
      scalePerPoint: 0.022,

      welcomeName: "Courtney",

      // Gust/wind behavior
      gustMinDelayMs: 7000,
      gustMaxDelayMs: 15000,
      gustHoldMinMs: 2800,
      gustHoldMaxMs: 4200,

      debugLogTarget: false,

      assets: {
        balloonPng: "assets/balloon.png",
        inflateSfx: "assets/inflate.mp3",
        popSfx: "assets/pop.mp3",
        celebrateMusic: "assets/celebrate.mp3",
        clickSfx: "assets/click.mp3",
        rumbleSfx: "assets/rumble.mp3"
      }
    };

    // =========================
    // State
    // =========================
    let target = 0;
    let total = 0;
    let currentScale = 0;
    let animating = false;
    let popped = false;
    let started = false;

    let gustTimer = null;
    let gustResetTimer = null;

    // =========================
    // Elements
    // =========================
    const balloonEl = document.getElementById("balloon");
    const rumbleWrapEl = document.getElementById("balloonRumble");
    const windEl = document.getElementById("balloonWind");
    const swayEl = document.getElementById("balloonSway");
    const burstEl = document.getElementById("burst");

    const totalEl = document.getElementById("totalPoints");
    const logEl = document.getElementById("log");

    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const ptButtons = Array.from(document.querySelectorAll(".ptBtn"));

    const fadeEl = document.getElementById("fade");
    const welcomeEl = document.getElementById("welcome");
    const welcomeTextEl = document.getElementById("welcomeText");
    const welcomeSubtextEl = document.getElementById("welcomeSubtext");
    const welcomeResetBtn = document.getElementById("welcomeResetBtn");
    const confettiEl = document.getElementById("confetti");

    // =========================
    // Audio
    // =========================
    const inflateAudio = new Audio(CONFIG.assets.inflateSfx);
    inflateAudio.loop = true;

    const popAudio = new Audio(CONFIG.assets.popSfx);

    const celebrateAudio = new Audio(CONFIG.assets.celebrateMusic);
    celebrateAudio.loop = true;

    const clickAudio = new Audio(CONFIG.assets.clickSfx);

    const rumbleAudio = new Audio(CONFIG.assets.rumbleSfx);
    rumbleAudio.loop = true;

    // =========================
    // Helpers
    // =========================
    function randInt(min, max){
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function randFloat(min, max){
      return Math.random() * (max - min) + min;
    }

    function clamp(n, min, max){
      return Math.max(min, Math.min(max, n));
    }

    function setTotal(n){
      totalEl.textContent = String(n);
    }

    function setLog(text){
      logEl.textContent = text || "";
    }

    function setBalloonScale(s){
      currentScale = s;
      balloonEl.style.transform = `scale(${s})`;
      balloonEl.style.setProperty("--s", s);
    }

    function desiredScaleForTotal(t){
      return CONFIG.baseScale + (t * CONFIG.scalePerPoint);
    }

    function sleep(ms){
      return new Promise(res => setTimeout(res, ms));
    }

    function stopAllAudio(){
      try { inflateAudio.pause(); inflateAudio.currentTime = 0; } catch(e){}
      try { popAudio.pause(); popAudio.currentTime = 0; } catch(e){}
      try { celebrateAudio.pause(); celebrateAudio.currentTime = 0; } catch(e){}
      try { clickAudio.pause(); clickAudio.currentTime = 0; } catch(e){}
      try { rumbleAudio.pause(); rumbleAudio.currentTime = 0; } catch(e){}
    }

    function safePlay(audio){
      audio.volume = 1.0;
      audio.play().catch(()=>{});
    }

    function playClick(){
      try { clickAudio.currentTime = 0; } catch(e){}
      safePlay(clickAudio);
    }

    // Smooth scaling animation with requestAnimationFrame
    function animateScale(from, to, durationMs){
      return new Promise(resolve => {
        const start = performance.now();
        const delta = to - from;

        function frame(now){
          const t = clamp((now - start) / durationMs, 0, 1);
          // easeOutCubic
          const eased = 1 - Math.pow(1 - t, 3);
          setBalloonScale(from + delta * eased);

          if (t < 1) requestAnimationFrame(frame);
          else resolve();
        }

        requestAnimationFrame(frame);
      });
    }

    // slower sway overall, but still grows a bit with points
    function setSwayForTotal(t){
      const deg = clamp(1.0 + (t * 0.045), 1.0, 5.2);
      const x   = clamp(5   + (t * 0.18),  5,   18);
      const y   = clamp(2   + (t * 0.02),  2,   5);

      // slower side-to-side; slight speed-up as it grows, but still slow
      const duration = clamp(6.2 - (t * 0.02), 4.8, 6.2);

      swayEl.style.setProperty("--sway-deg", `${deg}deg`);
      swayEl.style.setProperty("--sway-x", `${x}px`);
      swayEl.style.setProperty("--sway-y", `${y}px`);
      swayEl.style.animationDuration = `${duration}s`;
    }

    function setWindBias(deg, x){
      windEl.style.setProperty("--wind-deg", `${deg}deg`);
      windEl.style.setProperty("--wind-x", `${x}px`);
    }

    function clearWindTimers(){
      if (gustTimer) clearTimeout(gustTimer);
      if (gustResetTimer) clearTimeout(gustResetTimer);
      gustTimer = null;
      gustResetTimer = null;
      setWindBias(0, 0);
    }

    function scheduleGust(){
      clearTimeout(gustTimer);
      const delay = randInt(CONFIG.gustMinDelayMs, CONFIG.gustMaxDelayMs);
      gustTimer = setTimeout(() => runGust(), delay);
    }

    function runGust(){
      if (!started || popped) return;

      const dir = Math.random() < 0.5 ? -1 : 1;

      // gust strength increases slightly as total grows (because drama)
      const baseDeg = 2.0 + (total * 0.03);
      const baseX   = 12  + (total * 0.16);

      const deg = dir * randFloat(baseDeg, baseDeg + 1.8);
      const x   = dir * randFloat(baseX,   baseX   + 8);

      setWindBias(deg, x);

      const hold = randInt(CONFIG.gustHoldMinMs, CONFIG.gustHoldMaxMs);
      gustResetTimer = setTimeout(() => {
        setWindBias(0, 0);
        scheduleGust();
      }, hold);
    }

    // Paw SVG as background-image (color injected)
    function pawDataUrl(hexColor){
      // Simple paw: one big pad + 4 toes
      // Keep it tiny and readable. Encode to avoid quote issues.
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <g fill="${hexColor}">
            <ellipse cx="20" cy="20" rx="7" ry="9"/>
            <ellipse cx="32" cy="16" rx="7" ry="9"/>
            <ellipse cx="44" cy="20" rx="7" ry="9"/>
            <ellipse cx="52" cy="30" rx="6" ry="8"/>
            <path d="M18 44c0-10 10-18 22-18s20 8 20 18-9 18-21 18S18 54 18 44z"/>
          </g>
        </svg>`;
      return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
    }

    function spawnPawprints(count=28){
      confettiEl.innerHTML = "";
      for(let i=0; i<count; i++){
        const d = document.createElement("div");
        d.className = "paw";

        const left = Math.random() * 100;
        const delay = Math.random() * 1.6;
        const duration = 2.0 + Math.random() * 2.2;
        const size = 18 + Math.random() * 18;

        const color = Math.random() < 0.5 ? "#F36E21" : "#111111"; // orange or black
        d.style.backgroundImage = pawDataUrl(color);

        d.style.left = left + "vw";
        d.style.animationDelay = delay + "s";
        d.style.animationDuration = duration + "s";
        d.style.width = size + "px";
        d.style.height = size + "px";
        d.style.top = (-60 - Math.random() * 140) + "px";

        confettiEl.appendChild(d);
      }
    }

    function setControlsEnabled(enabled){
      ptButtons.forEach(b => b.disabled = !enabled);
    }

    // =========================
    // Game lifecycle
    // =========================
    function resetToPreStart(){
      stopAllAudio();
      clearWindTimers();

      total = 0;
      animating = false;
      popped = false;
      started = false;

      target = randInt(CONFIG.minTarget, CONFIG.maxTarget);
      if (CONFIG.debugLogTarget) console.log("Secret target:", target);

      balloonEl.src = CONFIG.assets.balloonPng;
      balloonEl.classList.remove("pop");
      balloonEl.style.opacity = "1";
      balloonEl.style.display = "block";

      fadeEl.classList.remove("on");
      welcomeEl.classList.remove("on");

      // balloon is hidden (size 0) until Start
      setBalloonScale(0);

      // reset motion
      swayEl.style.animationPlayState = "running";
      setSwayForTotal(0);
      setWindBias(0, 0);
      rumbleWrapEl.classList.remove("rumbling");

      setTotal(total);
      setLog("");

      startBtn.disabled = false;
      setControlsEnabled(false);

      welcomeTextEl.textContent = `Welcome, ${CONFIG.welcomeName}!`;
      welcomeSubtextEl.textContent = `We are excited to work under your leadership! Thanks for playing!`;
    }

    async function startGame(){
      if (animating || started) return;

      started = true;
      animating = true;
      startBtn.disabled = true;

      // Inflate from 0 -> base size using same inflation timing
      safePlay(inflateAudio);
      await animateScale(0, CONFIG.baseScale, CONFIG.inflateDurationMs);
      inflateAudio.pause();
      inflateAudio.currentTime = 0;

      animating = false;
      setControlsEnabled(true);

      scheduleGust();
    }

    async function addPoints(points){
      if (!started || animating || popped) return;

      points = clamp(points, 1, 10);

      animating = true;
      setControlsEnabled(false);

      setLog(`Added ${points} point(s).`);

      const fromTotal = total;
      const toTotal = total + points;
      total = toTotal;
      setTotal(total);

      // ramp sway a bit as it grows
      setSwayForTotal(total);

      // requested: 1 second pause after selecting points before inflating
      await sleep(CONFIG.beforeInflateDelayMs);

      // inflate animation + sound
      safePlay(inflateAudio);

      const fromScale = desiredScaleForTotal(fromTotal);
      const toScale = desiredScaleForTotal(toTotal);
      await animateScale(fromScale, toScale, CONFIG.inflateDurationMs);

      inflateAudio.pause();
      inflateAudio.currentTime = 0;

      // Pop check
      if (total >= target){
        await prePopRumbleThenPop();
        return;
      }

      animating = false;
      setControlsEnabled(true);
    }

    async function prePopRumbleThenPop(){
      // requested: gently shake for 2 seconds with rumble.mp3
      rumbleWrapEl.classList.add("rumbling");
      safePlay(rumbleAudio);

      await sleep(CONFIG.rumbleDurationMs);

      rumbleAudio.pause();
      rumbleAudio.currentTime = 0;
      rumbleWrapEl.classList.remove("rumbling");

      await popSequence();
    }

    async function popSequence(){
      if (popped) return;
      popped = true;
      clearWindTimers();

      // freeze sway so the pop feels deliberate
      swayEl.style.animationPlayState = "paused";
      setControlsEnabled(false);

      // Burst ring centered on balloon
      const rect = balloonEl.getBoundingClientRect();
      burstEl.style.left = (rect.left + rect.width / 2) + "px";
      burstEl.style.top  = (rect.top  + rect.height / 2) + "px";
      burstEl.classList.remove("show");
      void burstEl.offsetWidth;
      burstEl.classList.add("show");

      safePlay(popAudio);

      balloonEl.classList.add("pop");

      await sleep(520);

      // Fade to black (keep your original transition)
      fadeEl.classList.add("on");
      await sleep(950);

      // Welcome screen
      spawnPawprints(34);
      welcomeEl.classList.add("on");
      safePlay(celebrateAudio);

      animating = false;
    }

    // =========================
    // Events
    // =========================
    startBtn.addEventListener("click", startGame);

    ptButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        playClick();
        const pts = Number(btn.dataset.points);
        addPoints(pts);
      });
    });

    resetBtn.addEventListener("click", resetToPreStart);
    welcomeResetBtn.addEventListener("click", resetToPreStart);

    // Start at pre-start state (balloon invisible until Start)
    resetToPreStart();
  </script>
</body>
</html>
