<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RITchie's Pop Star</title>
  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#1b2b4a;
      --panel: rgba(255,255,255,0.08);
      --text: #eaf0ff;
      --muted: rgba(234,240,255,0.75);
      --accent: #7aa7ff;

      /* NEW: push balloon down so max size ends up centered-ish */
      --balloon-pos-y: clamp(70px, 9vh, 140px);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 20% 20%, var(--bg2), var(--bg1));
      overflow:hidden;
    }

    .wrap{
      position:relative;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .game{
      width:min(1060px, 100%);
      display:grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap:18px;
      align-items:stretch;
    }

    @media (max-width: 880px){
      .game{ grid-template-columns:1fr; }
    }

    .stage, .panel{
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius:18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .stage{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 580px;
      overflow:hidden;
    }

    /* NEW: a dedicated positioning wrapper so transforms don't clash with rumble */
    .balloon-pos{
      transform: translateY(var(--balloon-pos-y));
      will-change: transform;
    }

    /* ============
       Motion layers:
       balloon-pos (positioning)
         balloon-rumble (shake pre-pop)
           balloon-wind (gust bias)
             balloon-sway (regular sway)
               img (scale + pop)
       ============ */

    .balloon-rumble{
      transform-origin: 50% 80%;
      will-change: transform;
    }

    .balloon-rumble.rumbling{
      animation: rumble 120ms ease-in-out infinite;
    }
    @keyframes rumble{
      0%   { transform: translateX(0px) rotate(0deg); }
      25%  { transform: translateX(1px) rotate(-0.2deg); }
      50%  { transform: translateX(0px) rotate(0.2deg); }
      75%  { transform: translateX(-1px) rotate(-0.2deg); }
      100% { transform: translateX(0px) rotate(0deg); }
    }

    .balloon-wind{
      --wind-deg: 0deg;
      --wind-x: 0px;

      transform-origin: 50% 80%;
      will-change: transform;
      transform: rotate(var(--wind-deg)) translateX(var(--wind-x));
      transition: transform 700ms ease-in-out;
    }

    .balloon-sway{
      --sway-deg: 1.0deg;
      --sway-x: 5px;
      --sway-y: 2px;

      transform-origin: 50% 80%;
      will-change: transform;
      animation: sway 6.8s ease-in-out infinite;
    }

    @keyframes sway{
      0%{
        transform:
          rotate(calc(-1 * var(--sway-deg)))
          translateX(calc(-1 * var(--sway-x)))
          translateY(var(--sway-y));
      }
      50%{
        transform:
          rotate(var(--sway-deg))
          translateX(var(--sway-x))
          translateY(calc(-1 * var(--sway-y)));
      }
      100%{
        transform:
          rotate(calc(-1 * var(--sway-deg)))
          translateX(calc(-1 * var(--sway-x)))
          translateY(var(--sway-y));
      }
    }

    .balloon{
      width: 250px;
      height: auto;
      transform-origin: 50% 80%;
      transform: scale(0);
      filter: drop-shadow(0 18px 22px rgba(0,0,0,0.45));
      user-select:none;
      -webkit-user-drag:none;
    }

    .pop{
      animation: pop 420ms ease-out forwards;
    }
    @keyframes pop{
      0%   { transform: scale(var(--s, 1)); opacity:1; }
      55%  { transform: scale(calc(var(--s, 1) * 1.12)); opacity:1; }
      100% { transform: scale(calc(var(--s, 1) * 0.25)); opacity:0; }
    }

    .burst{
      position:absolute;
      width: 10px;
      height: 10px;
      border-radius:50%;
      border: 3px solid rgba(255,255,255,0.75);
      opacity:0;
      transform: scale(0.2);
      pointer-events:none;
    }
    .burst.show{
      animation: burst 520ms ease-out forwards;
    }
    @keyframes burst{
      0%{ opacity:0; transform: scale(0.2); }
      20%{ opacity:0.95; }
      100%{ opacity:0; transform: scale(18); }
    }

    .panel{
      padding:20px 20px 18px;
      display:flex;
      flex-direction:column;
      gap:14px;
      min-height: 580px;
    }

    .title{
      font-size: 30px;
      letter-spacing:0.2px;
      margin:0;
      font-weight: 900;
    }

    button{
      padding:14px 16px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.16);
      background: rgba(122,167,255,0.18);
      color: var(--text);
      font-weight:800;
      cursor:pointer;
    }
    button:hover{ background: rgba(122,167,255,0.24); }
    button:disabled{
      opacity:0.5;
      cursor:not-allowed;
    }

    .start-btn{
      width: 100%;
      padding: 16px 16px;
      font-size: 18px;
      background: rgba(122,167,255,0.28);
    }
    .start-btn:hover{ background: rgba(122,167,255,0.34); }

    .points-grid{
      display:grid;
      grid-template-columns: repeat(6, 1fr);
      gap:12px;
    }

    .points-grid button{
      padding: 18px 0;
      font-size: 22px;
      border-radius: 16px;
    }

    .grid-spacer{
      visibility:hidden;
      pointer-events:none;
    }

    .stats{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }

    .card{
      padding:14px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
    }

    .label{
      font-size:15px;
      color: var(--muted);
      margin:0 0 6px 0;
      font-weight: 700;
    }
    .value{
      font-size:40px;
      margin:0;
      font-weight:900;
      line-height: 1;
    }

    .logline{
      min-height: 28px;
      font-size: 18px;
      color: rgba(234,240,255,0.88);
      padding: 2px 2px;
      font-weight: 650;
    }

    .spacer{ flex:1; }

    .bottom-actions{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
      margin-top: 10px;
    }

    .range-btn{
      background: rgba(255,255,255,0.10);
    }
    .range-btn:hover{ background: rgba(255,255,255,0.14); }

    .reset-btn{
      background: rgba(255,255,255,0.10);
    }
    .reset-btn:hover{ background: rgba(255,255,255,0.14); }

    .fade{
      position:fixed;
      inset:0;
      background:#000;
      opacity:0;
      pointer-events:none;
      transition: opacity 900ms ease;
      z-index: 50;
    }
    .fade.on{
      opacity:1;
      pointer-events:auto;
    }

    .welcome{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:18px;
      opacity:0;
      pointer-events:none;
      z-index: 60;
      transition: opacity 600ms ease;
      background: radial-gradient(900px 600px at 50% 30%, rgba(255,255,255,1), rgba(230,236,246,1));
      text-align:center;
      padding:24px;
      color:#0b0f18;
    }
    .welcome.on{
      opacity:1;
      pointer-events:auto;
    }
    .welcome h1{
      margin:0;
      font-size: clamp(74px, 7vw, 102px);
      letter-spacing: 0.6px;
    }
    .welcome p{
      margin:0;
      color: rgba(11,15,24,0.88);
      font-size: clamp(22px, 2.4vw, 30px);
      max-width: 54ch;
      font-weight: 650;
      line-height: 1.35;
    }
    .welcome button{
      color:#0b0f18;
      background: rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.15);
    }
    .welcome button:hover{
      background: rgba(0,0,0,0.09);
    }

    .confetti{
      position:absolute;
      inset:0;
      overflow:hidden;
      pointer-events:none;
    }
    .paw{
      position:absolute;
      width: 28px;
      height: 28px;
      opacity: 0.0;
      background-repeat:no-repeat;
      background-size: contain;
      animation: fall 2.6s linear infinite;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.18));
    }
    @keyframes fall{
      0% { transform: translateY(-40px) rotate(0deg); opacity:0; }
      12%{ opacity:0.95; }
      90%{ opacity:0.95; }
      100%{ transform: translateY(110vh) rotate(65deg); opacity:0; }
    }

    .modal-backdrop{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 80;
      padding: 18px;
    }
    .modal-backdrop.on{ display:flex; }

    .modal{
      width: min(520px, 100%);
      background: rgba(20,28,48,0.92);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    .modal h3{
      margin: 0 0 10px 0;
      font-size: 18px;
      font-weight: 900;
    }
    .modal p{
      margin: 0 0 12px 0;
      color: rgba(234,240,255,0.78);
      font-size: 14px;
      line-height: 1.35;
    }
    .modal .fields{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .modal label{
      display:block;
      font-size: 12px;
      color: rgba(234,240,255,0.78);
      margin-bottom: 6px;
      font-weight: 700;
    }
    .modal input{
      width: 100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.25);
      color: var(--text);
      outline:none;
      font-size: 16px;
      font-weight: 700;
    }
    .modal .actions{
      display:flex;
      gap: 10px;
      justify-content:flex-end;
      flex-wrap: wrap;
    }
    .modal .error{
      min-height: 18px;
      color: rgba(255,180,180,0.95);
      font-size: 13px;
      font-weight: 700;
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="game" id="gameRoot">
      <div class="stage">
        <div class="burst" id="burst"></div>

        <!-- NEW: positioning wrapper -->
        <div class="balloon-pos" id="balloonPos">
          <div id="balloonRumble" class="balloon-rumble">
            <div id="balloonWind" class="balloon-wind">
              <div id="balloonSway" class="balloon-sway">
                <img
                  id="balloon"
                  class="balloon"
                  src="assets/balloon.png"
                  alt="RITchie Balloon"
                  draggable="false"
                />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2 class="title">RITchie's Pop Star</h2>

        <button id="startBtn" class="start-btn" type="button">Start</button>

        <div class="points-grid" id="pointsGrid" aria-label="Point buttons 1 to 11">
          <button class="ptBtn" data-points="1" type="button">1</button>
          <button class="ptBtn" data-points="2" type="button">2</button>
          <button class="ptBtn" data-points="3" type="button">3</button>
          <button class="ptBtn" data-points="4" type="button">4</button>
          <button class="ptBtn" data-points="5" type="button">5</button>
          <div class="grid-spacer" aria-hidden="true"></div>

          <button class="ptBtn" data-points="6" type="button">6</button>
          <button class="ptBtn" data-points="7" type="button">7</button>
          <button class="ptBtn" data-points="8" type="button">8</button>
          <button class="ptBtn" data-points="9" type="button">9</button>
          <button class="ptBtn" data-points="10" type="button">10</button>
          <button class="ptBtn" data-points="11" type="button">11</button>
        </div>

        <div class="stats">
          <div class="card">
            <p class="label">Total points</p>
            <p class="value" id="totalPoints">0</p>
          </div>
        </div>

        <div class="logline" id="log" aria-live="polite"></div>

        <div class="spacer"></div>

        <div class="bottom-actions">
          <button id="rangeBtn" class="range-btn" type="button">Adjust Range</button>
          <button id="resetBtn" class="reset-btn" type="button">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <div class="fade" id="fade"></div>

  <div class="welcome" id="welcome">
    <div class="confetti" id="confetti"></div>
    <h1 id="welcomeText">Welcome, Courtney!</h1>
    <p id="welcomeSubtext">
      We are excited to work under your leadership!<br>
      Thanks for playing!
    </p>
    <button id="welcomeResetBtn" type="button">Play Again</button>
  </div>

  <div id="rangeModalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="rangeModalTitle">
    <div class="modal">
      <h3 id="rangeModalTitle">Set pop range</h3>
      <p>This controls the hidden random total that causes the balloon to pop. Changing the range resets the game.</p>

      <div class="fields">
        <div>
          <label for="minRangeInput">Minimum</label>
          <input id="minRangeInput" type="number" inputmode="numeric" />
        </div>
        <div>
          <label for="maxRangeInput">Maximum</label>
          <input id="maxRangeInput" type="number" inputmode="numeric" />
        </div>
      </div>

      <div class="actions">
        <button id="rangeCancelBtn" type="button" class="range-btn">Cancel</button>
        <button id="rangeSaveBtn" type="button">Save</button>
      </div>

      <div id="rangeError" class="error"></div>
    </div>
  </div>

  <script>
    const CONFIG = {
      minTarget: 45,
      maxTarget: 65,

      inflateDurationMs: 2000,
      beforeInflateDelayMs: 1000,

      closeThreshold: 15,
      closePauseMs: 3000,
      drumrollMaxWaitMs: 4500,

      rumbleDurationMs: 2000,

      baseScale: 0.35,

      // CHANGED: make max about ~10% larger by increasing per-point scale 10%
      // was 0.022; now 0.0242
      scalePerPoint: 0.0242,

      welcomeName: "Courtney",

      gustMinDelayMs: 7000,
      gustMaxDelayMs: 15000,
      gustHoldMinMs: 2800,
      gustHoldMaxMs: 4200,

      debugLogTarget: false,

      assets: {
        balloonPng: "assets/balloon.png",
        inflateSfx: "assets/inflate.mp3",
        popSfx: "assets/pop.mp3",
        celebrateMusic: "assets/celebrate.mp3",
        clickSfx: "assets/click.mp3",
        rumbleSfx: "assets/rumble.mp3",
        drumrollSfx: "assets/drumroll.mp3"
      }
    };

    let target = 0;
    let total = 0;
    let animating = false;
    let popped = false;
    let started = false;

    let gustTimer = null;
    let gustResetTimer = null;

    const balloonEl = document.getElementById("balloon");
    const rumbleWrapEl = document.getElementById("balloonRumble");
    const windEl = document.getElementById("balloonWind");
    const swayEl = document.getElementById("balloonSway");
    const burstEl = document.getElementById("burst");

    const totalEl = document.getElementById("totalPoints");
    const logEl = document.getElementById("log");

    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const rangeBtn = document.getElementById("rangeBtn");
    const ptButtons = Array.from(document.querySelectorAll(".ptBtn"));

    const fadeEl = document.getElementById("fade");
    const welcomeEl = document.getElementById("welcome");
    const welcomeTextEl = document.getElementById("welcomeText");
    const welcomeSubtextEl = document.getElementById("welcomeSubtext");
    const welcomeResetBtn = document.getElementById("welcomeResetBtn");
    const confettiEl = document.getElementById("confetti");

    const rangeModalBackdrop = document.getElementById("rangeModalBackdrop");
    const minRangeInput = document.getElementById("minRangeInput");
    const maxRangeInput = document.getElementById("maxRangeInput");
    const rangeSaveBtn = document.getElementById("rangeSaveBtn");
    const rangeCancelBtn = document.getElementById("rangeCancelBtn");
    const rangeError = document.getElementById("rangeError");

    const inflateAudio = new Audio(CONFIG.assets.inflateSfx);
    inflateAudio.loop = true;

    const popAudio = new Audio(CONFIG.assets.popSfx);

    const celebrateAudio = new Audio(CONFIG.assets.celebrateMusic);
    celebrateAudio.loop = true;

    const clickAudio = new Audio(CONFIG.assets.clickSfx);

    const rumbleAudio = new Audio(CONFIG.assets.rumbleSfx);
    rumbleAudio.loop = true;

    const drumrollAudio = new Audio(CONFIG.assets.drumrollSfx);

    function randInt(min, max){
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function randFloat(min, max){
      return Math.random() * (max - min) + min;
    }

    function clamp(n, min, max){
      return Math.max(min, Math.min(max, n));
    }

    function setTotal(n){
      totalEl.textContent = String(n);
    }

    function setLog(text){
      logEl.textContent = text || "";
    }

    function setBalloonScale(s){
      balloonEl.style.transform = `scale(${s})`;
      balloonEl.style.setProperty("--s", s);
    }

    function desiredScaleForTotal(t){
      return CONFIG.baseScale + (t * CONFIG.scalePerPoint);
    }

    function sleep(ms){
      return new Promise(res => setTimeout(res, ms));
    }

    function stopAllAudio(){
      try { inflateAudio.pause(); inflateAudio.currentTime = 0; } catch(e){}
      try { popAudio.pause(); popAudio.currentTime = 0; } catch(e){}
      try { celebrateAudio.pause(); celebrateAudio.currentTime = 0; } catch(e){}
      try { clickAudio.pause(); clickAudio.currentTime = 0; } catch(e){}
      try { rumbleAudio.pause(); rumbleAudio.currentTime = 0; } catch(e){}
      try { drumrollAudio.pause(); drumrollAudio.currentTime = 0; } catch(e){}
    }

    function safePlay(audio){
      audio.volume = 1.0;
      audio.play().catch(()=>{});
    }

    function playClick(){
      try { clickAudio.currentTime = 0; } catch(e){}
      safePlay(clickAudio);
    }

    function playDrumrollWithCap(maxWaitMs){
      return new Promise(resolve => {
        let done = false;

        const cleanup = () => {
          if (done) return;
          done = true;
          try { drumrollAudio.removeEventListener("ended", onEnded); } catch(e){}
          resolve();
        };

        const onEnded = () => cleanup();

        try { drumrollAudio.currentTime = 0; } catch(e){}
        drumrollAudio.addEventListener("ended", onEnded, { once: true });
        safePlay(drumrollAudio);

        setTimeout(cleanup, maxWaitMs);
      });
    }

    function animateScale(from, to, durationMs){
      return new Promise(resolve => {
        const start = performance.now();
        const delta = to - from;

        function frame(now){
          const t = clamp((now - start) / durationMs, 0, 1);
          const eased = 1 - Math.pow(1 - t, 3);
          setBalloonScale(from + delta * eased);

          if (t < 1) requestAnimationFrame(frame);
          else resolve();
        }

        requestAnimationFrame(frame);
      });
    }

    function setSwayForTotal(t){
      const deg = clamp(1.0 + (t * 0.040), 1.0, 5.0);
      const x   = clamp(5   + (t * 0.16),  5,   18);
      const y   = clamp(2   + (t * 0.02),  2,   5);

      const duration = clamp(6.8 - (t * 0.018), 5.0, 6.8);

      swayEl.style.setProperty("--sway-deg", `${deg}deg`);
      swayEl.style.setProperty("--sway-x", `${x}px`);
      swayEl.style.setProperty("--sway-y", `${y}px`);
      swayEl.style.animationDuration = `${duration}s`;
    }

    function setWindBias(deg, x){
      windEl.style.setProperty("--wind-deg", `${deg}deg`);
      windEl.style.setProperty("--wind-x", `${x}px`);
    }

    function clearWindTimers(){
      if (gustTimer) clearTimeout(gustTimer);
      if (gustResetTimer) clearTimeout(gustResetTimer);
      gustTimer = null;
      gustResetTimer = null;
      setWindBias(0, 0);
    }

    function scheduleGust(){
      clearTimeout(gustTimer);
      const delay = randInt(CONFIG.gustMinDelayMs, CONFIG.gustMaxDelayMs);
      gustTimer = setTimeout(() => runGust(), delay);
    }

    function runGust(){
      if (!started || popped) return;

      const dir = Math.random() < 0.5 ? -1 : 1;

      const baseDeg = 2.0 + (total * 0.028);
      const baseX   = 12  + (total * 0.14);

      const deg = dir * randFloat(baseDeg, baseDeg + 1.8);
      const x   = dir * randFloat(baseX,   baseX   + 8);

      setWindBias(deg, x);

      const hold = randInt(CONFIG.gustHoldMinMs, CONFIG.gustHoldMaxMs);
      gustResetTimer = setTimeout(() => {
        setWindBias(0, 0);
        scheduleGust();
      }, hold);
    }

    function pawDataUrl(hexColor){
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <g fill="${hexColor}">
            <ellipse cx="20" cy="20" rx="7" ry="9"/>
            <ellipse cx="32" cy="16" rx="7" ry="9"/>
            <ellipse cx="44" cy="20" rx="7" ry="9"/>
            <ellipse cx="52" cy="30" rx="6" ry="8"/>
            <path d="M18 44c0-10 10-18 22-18s20 8 20 18-9 18-21 18S18 54 18 44z"/>
          </g>
        </svg>`;
      return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
    }

    function spawnPawprints(count=32){
      confettiEl.innerHTML = "";
      for(let i=0; i<count; i++){
        const d = document.createElement("div");
        d.className = "paw";

        const left = Math.random() * 100;
        const delay = Math.random() * 1.6;
        const duration = 2.0 + Math.random() * 2.2;
        const size = 18 + Math.random() * 20;

        const color = Math.random() < 0.5 ? "#F36E21" : "#111111";
        d.style.backgroundImage = pawDataUrl(color);

        d.style.left = left + "vw";
        d.style.animationDelay = delay + "s";
        d.style.animationDuration = duration + "s";
        d.style.width = size + "px";
        d.style.height = size + "px";
        d.style.top = (-60 - Math.random() * 140) + "px";

        confettiEl.appendChild(d);
      }
    }

    function setControlsEnabled(enabled){
      ptButtons.forEach(b => b.disabled = !enabled);
    }

    function updateRangeButtonLabel(){
      rangeBtn.textContent = "Adjust Range";
    }

    function remainingToPop(){
      return target - total;
    }

    async function closeToPopSuspenseIfNeeded(){
      const remain = remainingToPop();
      if (remain <= CONFIG.closeThreshold){
        await sleep(CONFIG.closePauseMs);
        await playDrumrollWithCap(CONFIG.drumrollMaxWaitMs);
      }
    }

    function openRangeModal(){
      rangeError.textContent = "";
      minRangeInput.value = String(CONFIG.minTarget);
      maxRangeInput.value = String(CONFIG.maxTarget);
      rangeModalBackdrop.classList.add("on");
      minRangeInput.focus();
    }

    function closeRangeModal(){
      rangeModalBackdrop.classList.remove("on");
    }

    function parseIntStrict(v){
      const n = Number(String(v).trim());
      if (!Number.isFinite(n)) return null;
      if (!Number.isInteger(n)) return null;
      return n;
    }

    function applyRangeFromModal(){
      const minV = parseIntStrict(minRangeInput.value);
      const maxV = parseIntStrict(maxRangeInput.value);

      if (minV === null || maxV === null){
        rangeError.textContent = "Please enter whole numbers for both minimum and maximum.";
        return;
      }
      if (minV < 1 || maxV < 1){
        rangeError.textContent = "Minimum and maximum must be at least 1.";
        return;
      }
      if (minV >= maxV){
        rangeError.textContent = "Minimum must be less than maximum.";
        return;
      }
      if ((maxV - minV) < 5){
        rangeError.textContent = "That range is tiny. Give it at least 5 points of wiggle room.";
        return;
      }

      CONFIG.minTarget = minV;
      CONFIG.maxTarget = maxV;

      closeRangeModal();
      resetToPreStart();
    }

    rangeModalBackdrop.addEventListener("click", (e) => {
      if (e.target === rangeModalBackdrop) closeRangeModal();
    });

    function resetToPreStart(){
      stopAllAudio();
      clearWindTimers();

      total = 0;
      animating = false;
      popped = false;
      started = false;

      target = randInt(CONFIG.minTarget, CONFIG.maxTarget);
      if (CONFIG.debugLogTarget) console.log("Secret target:", target);

      balloonEl.src = CONFIG.assets.balloonPng;
      balloonEl.classList.remove("pop");
      balloonEl.style.opacity = "1";
      balloonEl.style.display = "block";

      fadeEl.classList.remove("on");
      welcomeEl.classList.remove("on");

      setBalloonScale(0);

      swayEl.style.animationPlayState = "running";
      setSwayForTotal(0);
      setWindBias(0, 0);
      rumbleWrapEl.classList.remove("rumbling");

      setTotal(total);
      setLog("");

      startBtn.disabled = false;
      setControlsEnabled(false);

      welcomeTextEl.textContent = `Welcome, ${CONFIG.welcomeName}!`;
      welcomeSubtextEl.innerHTML = `We are excited to work under your leadership!<br>Thanks for playing!`;
    }

    async function startGame(){
      if (animating || started) return;

      started = true;
      animating = true;
      startBtn.disabled = true;

      safePlay(inflateAudio);
      await animateScale(0, CONFIG.baseScale, CONFIG.inflateDurationMs);
      inflateAudio.pause();
      inflateAudio.currentTime = 0;

      animating = false;
      setControlsEnabled(true);

      scheduleGust();
    }

    async function addPoints(points){
      if (!started || animating || popped) return;

      points = clamp(points, 1, 11);

      animating = true;
      setControlsEnabled(false);

      setLog(`Added ${points} point(s).`);

      const fromTotal = total;
      const toTotal = total + points;
      total = toTotal;
      setTotal(total);

      setSwayForTotal(total);

      await sleep(CONFIG.beforeInflateDelayMs);

      safePlay(inflateAudio);

      const fromScale = desiredScaleForTotal(fromTotal);
      const toScale = desiredScaleForTotal(toTotal);
      await animateScale(fromScale, toScale, CONFIG.inflateDurationMs);

      inflateAudio.pause();
      inflateAudio.currentTime = 0;

      await closeToPopSuspenseIfNeeded();

      if (total >= target){
        await prePopRumbleThenPop();
        return;
      }

      animating = false;
      setControlsEnabled(true);
    }

    async function prePopRumbleThenPop(){
      rumbleWrapEl.classList.add("rumbling");
      safePlay(rumbleAudio);

      await sleep(CONFIG.rumbleDurationMs);

      rumbleAudio.pause();
      rumbleAudio.currentTime = 0;
      rumbleWrapEl.classList.remove("rumbling");

      await popSequence();
    }

    async function popSequence(){
      if (popped) return;
      popped = true;
      clearWindTimers();

      swayEl.style.animationPlayState = "paused";
      setControlsEnabled(false);

      const rect = balloonEl.getBoundingClientRect();
      burstEl.style.left = (rect.left + rect.width / 2) + "px";
      burstEl.style.top  = (rect.top  + rect.height / 2) + "px";
      burstEl.classList.remove("show");
      void burstEl.offsetWidth;
      burstEl.classList.add("show");

      safePlay(popAudio);

      balloonEl.classList.add("pop");

      await sleep(520);

      fadeEl.classList.add("on");
      await sleep(950);

      spawnPawprints(36);
      welcomeEl.classList.add("on");
      safePlay(celebrateAudio);

      animating = false;
    }

    startBtn.addEventListener("click", startGame);

    ptButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        playClick();
        const pts = Number(btn.dataset.points);
        addPoints(pts);
      });
    });

    resetBtn.addEventListener("click", resetToPreStart);

    rangeBtn.addEventListener("click", () => {
      if (animating) return;
      openRangeModal();
    });

    rangeSaveBtn.addEventListener("click", applyRangeFromModal);
    rangeCancelBtn.addEventListener("click", closeRangeModal);

    welcomeResetBtn.addEventListener("click", resetToPreStart);

    updateRangeButtonLabel();
    resetToPreStart();
  </script>
</body>
</html>
